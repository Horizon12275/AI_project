apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service-deployment-1
  namespace: event-service
spec:
  replicas: 6
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: event-service
          image: horizon12275/event-service-with-skywalking:latest
          ports:
            - containerPort: 8101
          envFrom:
            - configMapRef:
                name: event-service-configmap